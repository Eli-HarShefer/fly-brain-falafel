<body class="shoot">

<!--
  A stage built for filming, not for reading.

  1080x1920, one idea per frame, everything inside the safe area that TikTok and
  Shorts leave free: 9% off the top, 20% off the bottom, and the right-hand
  button column. Same live components as the real page - nothing here is a
  mock-up - just laid out portrait and blown up so it survives a phone screen.

  ?scene=<id>  picks the scene.  ?safe=1  draws the safe-area guides.
-->

<main class="stage9" id="stage">
  <header class="s-head">
    <h1 class="s-title" id="s-title"></h1>
    <p class="s-sub" id="s-sub"></p>
  </header>

  <div class="s-body" id="s-body"></div>

  <footer class="s-foot">
    <p class="s-note" id="s-note"></p>
    <p class="s-credit" id="s-credit"></p>
  </footer>
</main>

<div class="safe" id="safe" hidden>
  <div class="safe__top"></div>
  <div class="safe__bottom"></div>
  <div class="safe__right"></div>
</div>

<script type="module" src="/src/shoot.js"></script>
</body>
</html>
